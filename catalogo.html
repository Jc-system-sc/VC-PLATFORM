<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelo Creativo — Catálogo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16283F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/animaciones.css">
<link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

<div id="app-frame">
  <header id="app-header"></header>

  <main id="app-content">
    <div id="grid-catalogo" class="grid-catalogo"></div>
  </main>

  <nav id="bottom-nav"></nav>
  <div id="mascota"></div>
  <div id="toast"></div>
</div>

<!-- ===== SHEET: Detalle de producto ===== -->
<div class="sheet-overlay" id="sheet-detalle-overlay" onclick="cerrarSheet('sheet-detalle')"></div>
<div class="sheet" id="sheet-detalle">
  <div class="sheet-handle"></div>
  <div class="detalle-imagen"></div>
  <h3 id="detalle-nombre"></h3>
  <p class="texto-suave" id="detalle-descripcion" style="margin:8px 0 4px;"></p>
  <p class="texto-suave" id="detalle-medidas" style="font-size:0.78rem;"></p>
  <span id="detalle-codigo"></span>
  <p class="texto-suave" style="margin-top:14px; font-size:0.8rem;">Elige tu presentación</p>
  <div style="display:flex; gap:10px; margin-top:8px;">
    <button class="btn-secundario" id="btn-agregar-bolsa" style="flex:1; width:auto;"></button>
    <button class="btn-primario" id="btn-agregar-caja" style="flex:1; width:auto;"></button>
  </div>
</div>

<!-- ===== SHEET: Carrito ===== -->
<div class="sheet-overlay" id="sheet-carrito-overlay" onclick="cerrarSheet('sheet-carrito')"></div>
<div class="sheet" id="sheet-carrito">
  <div class="sheet-handle"></div>
  <h3>Tu carrito</h3>
  <div id="lista-carrito" style="margin-top:10px;"></div>
  <div class="fila-total">
    <span>Total</span>
    <span class="dato-critico" id="carrito-total">S/ 0.00</span>
  </div>
  <button class="btn-primario" onclick="irACheckout()">Continuar con el pedido</button>
</div>

<!-- ===== SHEET: Checkout ===== -->
<div class="sheet-overlay" id="sheet-checkout-overlay" onclick="cerrarSheet('sheet-checkout')"></div>
<div class="sheet" id="sheet-checkout">
  <div class="sheet-handle"></div>
  <h3>Datos de entrega</h3>
  <form id="form-checkout" onsubmit="confirmarPedido(event)" style="margin-top:14px;">
    <div class="campo">
      <label>Nombre completo</label>
      <input type="text" id="checkout-nombre" required>
    </div>
    <div class="campo">
      <label>WhatsApp</label>
      <input type="tel" id="checkout-whatsapp" placeholder="9XXXXXXXX" required>
    </div>
    <div class="campo">
      <label>Dirección o referencia de entrega</label>
      <input type="text" id="checkout-direccion">
    </div>
    <div class="campo">
      <label>Fecha de entrega</label>
      <input type="date" id="checkout-fecha" required>
    </div>

    <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--color-marino); margin-bottom:8px;">Método de pago</label>
    <div class="metodos-pago">
      <button type="button" class="metodo-pago" id="metodo-yape" onclick="seleccionarMetodoPago('yape')">Yape</button>
      <button type="button" class="metodo-pago" id="metodo-bcp" onclick="seleccionarMetodoPago('bcp')">BCP</button>
      <button type="button" class="metodo-pago" id="metodo-efectivo" onclick="seleccionarMetodoPago('efectivo')">Efectivo</button>
    </div>
    <input type="hidden" id="checkout-metodo" value="">

    <div id="qr-pago">
      <div id="qr-imagen">QR</div>
      <p class="texto-suave">Escanea y paga el total del pedido</p>
    </div>

    <div class="campo">
      <label>Código de operación / N° de boleta</label>
      <input type="text" id="checkout-operacion" placeholder="Ej: 00123456">
    </div>

    <button type="submit" class="btn-primario">Confirmar pedido</button>
  </form>
</div>

<!-- ===== SHEET: Confirmación ===== -->
<div class="sheet-overlay" id="sheet-confirmacion-overlay"></div>
<div class="sheet" id="sheet-confirmacion">
  <div class="sheet-handle"></div>
  <div class="confirmacion-icono" id="confirmacion-icono"></div>
  <h3 style="text-align:center;">¡Pedido confirmado!</h3>
  <p class="texto-suave" style="text-align:center; margin-top:6px;">Tu pedido está en revisión. Te avisaremos cuando sea aceptado.</p>
  <div class="confirmacion-codigo-box">
    <p class="texto-suave">Código de seguimiento</p>
    <p id="confirmacion-codigo"></p>
  </div>
  <div class="acciones-boleta">
    <button class="btn-secundario" id="btn-descargar-boleta">Descargar boleta</button>
    <button class="btn-primario" id="btn-wsp-boleta">Enviar WhatsApp</button>
  </div>
  <button class="btn-secundario" style="margin-top:10px;" onclick="location.href='rastreo.html'">Ir a rastrear pedido</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  try { firebase.initializeApp(firebaseConfig); var db = firebase.firestore(); } catch (e) { console.warn("Configura Firebase en js/firebase-config.js"); }
</script>

<script src="js/utils/theme.js"></script>
<script src="js/utils/helpers.js"></script>
<script src="js/utils/mis-pedidos.js"></script>
<script src="js/components/icono-marca.js"></script>
<script src="js/components/header.js"></script>
<script src="js/components/bottom-nav.js"></script>
<script src="js/components/mascota.js"></script>
<script src="js/data/catalogo.js"></script>
<script src="js/modules/carrito.js"></script>
<script src="js/modules/boleta.js"></script>
<script src="js/modules/catalogo.js"></script>
<script>
  renderHeader({
    titulo: "Catálogo",
    accionExtra: `<button class="btn-carrito-flotante" onclick="abrirCarrito()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2l2.6 12.4a2 2 0 002 1.6h8.8a2 2 0 002-1.6L21 7H6"/></svg>
      <span id="carrito-badge">0</span>
    </button>`
  });
  renderBottomNav("catalogo");
  document.getElementById("confirmacion-icono").innerHTML = iconoAvionVC({ tamano: 44, color: "var(--color-acento)", conEstela: true });
  renderCatalogo();
  iniciarMascota([
    "Toca cualquier modelo para ver los detalles",
    "Puedes agregar varios cuadros a tu carrito"
  ]);
</script>
</body>
</html>
